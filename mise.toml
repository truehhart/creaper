monorepo_root = true

[tools]
"aqua:nushell/nushell" = "0.114.1"
"aqua:pre-commit/pre-commit" = "4.6.1"
"aqua:tamasfe/taplo" = "0.10.0"
sops = "3.13.3"

[monorepo]
config_roots = [".github", "app", "infra"]

[tasks.init]
depends = ["//...:init"]
description = "Install the git hooks and set up every part"
run = "pre-commit install"

[tasks.fmt]
depends = ["//...:fmt", "toml-fmt"]

[tasks.build]
depends = ["//...:build"]

[tasks.toml-fmt]
run = "taplo fmt"

[tasks.toml-lint]
run = "taplo lint"

[tasks.validate]
depends = ["//...:validate", "toml-fmt --check --diff", "toml-lint"]
