name: publish

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_zigbuild: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.18
          install: true
          cache: false
      - name: Install app toolchain
        working-directory: app
        run: mise install
      - name: Add Rust target
        working-directory: app
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- rustup target add "$TARGET"
      - name: Build Linux musl binary
        if: matrix.use_zigbuild
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: >-
          mise exec aqua:ziglang/zig@0.15.2 github:rust-cross/cargo-zigbuild@0.24.1 --
          cargo zigbuild --locked --release --target "$TARGET"
      - name: Build macOS binary
        if: '!matrix.use_zigbuild'
        working-directory: app
        env:
          TARGET: ${{ matrix.target }}
        run: mise exec -- cargo build --locked --release --target "$TARGET"
      - name: Package release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          stage="creaper-${RELEASE_TAG}-${TARGET}"
          mkdir -p "$stage"
          cp "app/target/${TARGET}/release/creaper" "$stage/creaper"
          cp LICENSE README.md "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
      - name: Upload release archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
